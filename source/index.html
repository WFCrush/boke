<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚风 · 导航</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @font-face{font-family:'LXGWSeal';src:url('https://cdn.jsdelivr.net/gh/lxgw/LxgwSeal@main/TTF/LXGWSeal-Regular.ttf') format('truetype');font-display:block}
  :root{--sky-0:#080a14;--sky-1:#101423;--sky-2:#1c2238;--ink:#d4dcf0;--ink-dim:#7a82a0;--ink-faint:#404868;--seal:#c43830;--seal-glow:rgba(196,56,48,.45);--celadon:#5e8a82;--celadon-glow:rgba(94,138,130,.35)}
  html,body{height:100%}
  body{background:var(--sky-0);font-family:'Songti SC','STSong','SimSun',serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 55% at 50% 25%,var(--sky-2),transparent),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(94,138,130,.06),transparent),radial-gradient(ellipse 50% 40% at 85% 75%,rgba(196,56,48,.04),transparent),linear-gradient(180deg,var(--sky-0),var(--sky-1))}
  .peaks{position:fixed;left:0;right:0;bottom:0;z-index:2;width:100%;height:48vh;min-height:240px;pointer-events:none}
  .peaks svg{width:100%;height:100%;display:block}
  .mist{position:fixed;left:-25%;width:150%;border-radius:50%;filter:blur(75px);z-index:3;pointer-events:none}
  .mist-a{height:240px;background:rgba(94,138,130,.1);bottom:16%;animation:dr-a 55s linear infinite}
  .mist-b{height:200px;background:rgba(140,160,200,.08);bottom:6%;animation:dr-b 70s linear infinite}
  .mist-c{height:280px;background:rgba(80,100,140,.06);bottom:26%;animation:dr-c 85s linear infinite}
  @keyframes dr-a{from{transform:translateX(0)}to{transform:translateX(22%)}}
  @keyframes dr-b{from{transform:translateX(12%)}to{transform:translateX(-18%)}}
  @keyframes dr-c{from{transform:translateX(-8%)}to{transform:translateX(16%)}}
  #rain{position:fixed;inset:0;z-index:4;pointer-events:none}
  #particles{position:fixed;inset:0;z-index:5;pointer-events:none}
  .halo{position:fixed;left:50%;top:42%;width:600px;height:600px;transform:translate(-50%,-50%);z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(94,138,130,.05),transparent 60%);animation:haloP 6s ease-in-out infinite}
  @keyframes haloP{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.12)}}
  .stage{position:relative;z-index:10;text-align:center;padding:50px 24px 80px;max-width:560px;width:100%}
  .title-wrap{margin-bottom:14px;position:relative;display:flex;justify-content:center;align-items:center}
  .title-svg{width:min(380px,76vw);height:auto;overflow:visible}
  .title-svg .zhuan{fill:var(--ink);filter:drop-shadow(0 0 22px rgba(180,195,230,.12))}
  .seal{display:inline-flex;align-items:center;justify-content:center;width:44px;height:52px;margin:0 auto 28px;background:var(--seal);color:#f0ede6;font-size:15px;font-weight:600;line-height:1.1;writing-mode:vertical-rl;letter-spacing:3px;box-shadow:0 2px 18px var(--seal-glow);border-radius:2px;position:relative;opacity:.92}
  .seal::before{content:'';position:absolute;inset:3px;border:1px solid rgba(240,237,230,.5);border-radius:1px}
  .tagline{font-size:14px;color:var(--ink-dim);margin-bottom:48px;letter-spacing:4px;font-family:'KaiTi','STKaiti','Kaiti SC','楷体',serif}
  .line{width:44px;height:1px;margin:0 auto 48px;position:relative;background:linear-gradient(90deg,transparent,rgba(200,208,232,.18),transparent)}
  .line::before{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--seal);transform:translate(-50%,-50%);opacity:.7;box-shadow:0 0 8px var(--seal-glow)}
  .links{display:flex;flex-direction:column}
  .card{display:flex;align-items:center;gap:20px;padding:24px 14px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:padding-left .5s ease,background .5s ease}
  .card::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,208,232,.07) 25%,rgba(200,208,232,.07) 75%,transparent);transition:background .5s ease}
  .card::before{content:'';position:absolute;left:-40px;top:50%;width:0;height:320px;transform:translateY(-50%);background:radial-gradient(ellipse,rgba(94,138,130,.13),transparent 65%);border-radius:50%;transition:width .7s cubic-bezier(.4,0,.2,1)}
  .card:hover{padding-left:30px;background:rgba(94,138,130,.04)}
  .card:hover::before{width:480px}
  .card:hover::after{background:linear-gradient(90deg,transparent,rgba(94,138,130,.2) 25%,rgba(94,138,130,.2) 75%,transparent)}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink-dim);opacity:.5;transition:all .5s ease}
  .card:hover .dot{opacity:1;background:var(--celadon);box-shadow:0 0 14px var(--celadon-glow);transform:scale(1.4)}
  .card-body{text-align:left;flex:1}
  .card-title{font-size:20px;font-weight:500;letter-spacing:5px;margin-bottom:5px;color:var(--ink);transition:color .5s ease}
  .card:hover .card-title{color:var(--celadon)}
  .card-desc{font-size:13px;color:var(--ink-faint);letter-spacing:1.5px}
  .colophon{position:fixed;left:26px;bottom:30px;z-index:10;writing-mode:vertical-rl;font-size:11px;color:rgba(106,114,144,.3);letter-spacing:6px;pointer-events:none}
  footer{position:fixed;bottom:22px;left:0;right:0;z-index:10;text-align:center;font-size:11px;color:rgba(106,114,144,.3);letter-spacing:3px}
  @media(max-width:560px){.title-svg{width:290px}.colophon{display:none}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}#rain,#particles{display:none}.mist{animation:none}.halo{animation:none}}
</style>

<script>
(function(){
  var rm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!rm){
    var rc=document.getElementById('rain'),rctx=rc.getContext('2d'),rw,rh,rd=[];
    function rR(){rw=rc.width=innerWidth;rh=rc.height=innerHeight;}
    rR();addEventListener('resize',rR);
    for(var i=0;i<90;i++){rd.push({x:Math.random()*rw,y:Math.random()*rh,len:Math.random()*14+10,sp:Math.random()*3+1.5,op:Math.random()*.07+.03});}
    (function rD(){rctx.clearRect(0,0,rw,rh);for(var i=0;i<rd.length;i++){var d=rd[i];d.y+=d.sp;if(d.y>rh){d.y=-d.len;d.x=Math.random()*rw;}rctx.beginPath();rctx.moveTo(d.x,d.y);rctx.lineTo(d.x-1.5,d.y+d.len);rctx.strokeStyle='rgba(150,165,200,'+d.op+')';rctx.lineWidth=.6;rctx.stroke();}requestAnimationFrame(rD);})();
  }
  if(!rm){
    var pc=document.getElementById('particles'),pctx=pc.getContext('2d'),pw,ph,pt=[];
    function pR(){pw=pc.width=innerWidth;ph=pc.height=innerHeight;}
    pR();addEventListener('resize',pR);
    for(var i=0;i<40;i++){pt.push({x:Math.random()*pw,y:Math.random()*ph,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*2.5+1,op:Math.random()*.1+.03});}
    var mx=-9999,my=-9999;addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});addEventListener('mouseleave',function(){mx=-9999;my=-9999;});
    (function pD(){pctx.clearRect(0,0,pw,ph);for(var i=0;i<pt.length;i++){var p=pt[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=pw;if(p.x>pw)p.x=0;if(p.y<0)p.y=ph;if(p.y>ph)p.y=0;var dx=p.x-mx,dy=p.y-my,dm=Math.sqrt(dx*dx+dy*dy);if(dm<140){p.x+=dx/dm*1.2;p.y+=dy/dm*1.2;}pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,Math.PI*2);pctx.fillStyle='rgba(94,138,130,'+p.op+')';pctx.fill();for(var j=i+1;j<pt.length;j++){var q=pt[j],ddx=p.x-q.x,ddy=p.y-q.y,dd=Math.sqrt(ddx*ddx+ddy*ddy);if(dd<140){pctx.beginPath();pctx.moveTo(p.x,p.y);pctx.lineTo(q.x,q.y);pctx.strokeStyle='rgba(94,138,130,'+(0.06*(1-dd/140))+')';pctx.lineWidth=.4;pctx.stroke();}}}requestAnimationFrame(pD);})();
  }
})();
</script>
