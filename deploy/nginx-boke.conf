limit_req_zone $binary_remote_addr zone=boke_skill_chat:10m rate=20r/m;

server {
    listen 80;
    server_name example.com;

    root /var/www/boke-site/current;
    index index.html;
    charset utf-8;

    location = / {
        return 302 /boke/;
    }

    location ^~ /boke/api/public-skill-chat/ {
        limit_req zone=boke_skill_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location ^~ /boke/ {
        try_files $uri $uri/ /boke/404.html;
    }

    location ~ /\. {
        deny all;
    }
}
